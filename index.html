<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#20262d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>나의 악보집</title>
  <link rel="manifest" href="site.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root{color-scheme:light dark;--bg:#f5f2ec;--sidebar:#eee9e1;--surface:#fff;--surface2:#f1ece4;--text:#182637;--muted:#68737e;--line:#ddd6cc;--accent:#ca7440;--accentSoft:#f7e6da;--navy:#263e57;--shadow:rgba(31,42,52,.11);--danger:#b23b38}
    :root[data-theme="dark"]{color-scheme:dark;--bg:#20262d;--sidebar:#252d36;--surface:#303a45;--surface2:#394552;--text:#f4f1ea;--muted:#b8c1ca;--line:#46525e;--accent:#e2955b;--accentSoft:#4c3e33;--navy:#dce8f4;--shadow:rgba(0,0,0,.28);--danger:#ff918d}
    @media(prefers-color-scheme:dark){:root[data-theme="system"]{color-scheme:dark;--bg:#20262d;--sidebar:#252d36;--surface:#303a45;--surface2:#394552;--text:#f4f1ea;--muted:#b8c1ca;--line:#46525e;--accent:#e2955b;--accentSoft:#4c3e33;--navy:#dce8f4;--shadow:rgba(0,0,0,.28);--danger:#ff918d}}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}.hidden{display:none!important}
    .app{height:100dvh;display:grid;grid-template-columns:220px minmax(0,1fr)}.sidebar{background:var(--sidebar);border-right:1px solid var(--line);padding:max(24px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;padding:0 8px 22px}.brand-icon{width:43px;height:43px;border-radius:14px;background:linear-gradient(145deg,#2c435c,#496982);color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px rgba(24,37,49,.22)}.brand-icon svg{width:24px;height:24px}.brand-kicker{font-size:10px;letter-spacing:.1em;color:var(--accent);font-weight:700}.brand-title{font-size:16px;font-weight:700;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:135px}.nav{display:grid;gap:6px}.nav-btn{height:47px;border:0;border-radius:13px;background:transparent;color:var(--muted);display:flex;align-items:center;gap:11px;padding:0 13px;text-align:left}.nav-btn.active{background:var(--accentSoft);color:var(--accent);font-weight:700}.nav-btn svg{width:19px;height:19px}.storage-info{margin-top:auto;border-top:1px solid var(--line);padding:16px 9px 2px;font-size:11px;color:var(--muted);line-height:1.55}.storage-info strong{display:block;color:var(--text);font-size:12px;margin-bottom:2px}.main{min-width:0;display:flex;flex-direction:column}.topbar{height:92px;flex:none;background:var(--sidebar);border-bottom:1px solid var(--line);padding:20px 25px;display:grid;grid-template-columns:minmax(260px,720px) auto;gap:18px;align-items:center}.search-wrap{display:grid;grid-template-columns:1fr 51px;gap:8px}.search-box{height:50px;border:1px solid var(--line);background:var(--surface);border-radius:15px;display:flex;align-items:center;padding:0 15px;gap:10px}.search-box svg{width:19px;color:var(--muted);flex:none}.search-box input{min-width:0;width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:16px}.search-box input::placeholder{color:var(--muted)}.clear-search{border:0;background:transparent;color:var(--muted);width:36px;height:36px;border-radius:10px}.search-go{height:50px;border:0;border-radius:15px;background:var(--accent);color:#fff;display:grid;place-items:center}.search-go svg{width:21px}.top-actions{display:flex;gap:8px;justify-content:flex-end}.icon-btn{width:46px;height:46px;border:0;border-radius:14px;background:var(--surface2);color:var(--text);display:grid;place-items:center}.icon-btn svg{width:20px}.content{flex:1;min-height:0;overflow:auto;padding:25px}.page{max-width:1120px;margin:0 auto}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:19px}.page-head h1{font-size:24px;margin:0;line-height:1.2}.page-head p{font-size:12px;color:var(--muted);margin:6px 0 0}.action-btn,.secondary-btn,.danger-btn{min-height:42px;border-radius:12px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:700}.action-btn{border:0;background:var(--accent);color:#fff}.secondary-btn{border:1px solid var(--line);background:var(--surface);color:var(--navy)}.danger-btn{border:1px solid color-mix(in srgb,var(--danger) 45%,var(--line));background:transparent;color:var(--danger)}.action-btn svg,.secondary-btn svg,.danger-btn svg{width:17px}.folder-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.folder-card{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:18px;padding:18px;text-align:left;min-height:137px;box-shadow:0 6px 18px var(--shadow);transition:transform .16s ease,box-shadow .16s ease}.folder-card:active{transform:scale(.985)}.folder-top,.folder-meta{display:flex;align-items:center;justify-content:space-between;gap:10px}.folder-symbol{width:42px;height:42px;border-radius:13px;background:var(--accentSoft);color:var(--accent);display:grid;place-items:center}.folder-symbol svg{width:21px}.folder-arrow{width:18px;color:var(--muted)}.folder-name{font-size:16px;font-weight:700;margin:15px 0 11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.folder-meta{font-size:11px;color:var(--muted)}.folder-count{font-size:13px;color:var(--navy);font-weight:700}.empty{border:1px dashed var(--line);border-radius:20px;padding:54px 24px;text-align:center;background:color-mix(in srgb,var(--surface) 60%,transparent)}.empty-icon{width:62px;height:62px;border-radius:20px;background:var(--accentSoft);color:var(--accent);display:grid;place-items:center;margin:0 auto 17px}.empty-icon svg{width:29px}.empty h2{font-size:19px;margin:0 0 8px}.empty p{font-size:13px;color:var(--muted);line-height:1.65;margin:0 0 21px}.list-layout{display:grid;grid-template-columns:minmax(330px,42%) minmax(360px,1fr);gap:18px;height:calc(100dvh - 142px)}.list-panel{min-width:0;display:flex;flex-direction:column}.list-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.back-btn{border:0;background:var(--surface2);color:var(--text);height:40px;border-radius:12px;padding:0 12px;display:flex;align-items:center;gap:7px;font-size:12px}.back-btn svg{width:17px}.song-list{overflow:auto;display:grid;gap:8px;padding-right:3px}.song-row{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:14px;padding:11px 12px;display:grid;grid-template-columns:47px minmax(0,1fr) 18px;align-items:center;gap:8px;text-align:left}.song-row.selected{border-color:var(--accent);background:var(--accentSoft)}.song-number{font-size:12px;color:var(--accent);font-weight:700}.song-title{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.song-path{font-size:10px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.song-row>svg{width:17px;color:var(--muted)}.preview{min-width:0;background:#171b20;border-radius:19px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 28px var(--shadow)}.preview-head{height:54px;flex:none;border-bottom:1px solid rgba(255,255,255,.1);color:#fff;padding:0 15px;display:flex;align-items:center;justify-content:space-between;gap:10px}.preview-copy{min-width:0}.preview-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview-sub{font-size:10px;color:#aeb7c0;margin-top:2px}.viewer-open{width:39px;height:39px;border:0;border-radius:11px;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center}.viewer-open svg{width:18px}.preview-stage{flex:1;min-height:0;padding:12px;display:grid;place-items:center}.preview-stage img{display:block;max-width:100%;max-height:100%;object-fit:contain;background:#fff}.preview-placeholder{color:#9ca7b1;font-size:13px;text-align:center;line-height:1.6}.results-title{font-size:16px;font-weight:700;margin:0 0 14px}.results-title span{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}.result-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.settings-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px}.settings-card h2{font-size:16px;margin:0 0 6px}.settings-card>p{font-size:12px;color:var(--muted);line-height:1.55;margin:0 0 15px}.inline-form{display:grid;grid-template-columns:1fr auto;gap:8px}.text-input,.select-input{height:45px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);padding:0 13px;font-size:16px}.settings-actions{display:flex;gap:9px;flex-wrap:wrap}.version-box{background:var(--surface2);border:1px solid var(--line);border-radius:13px;padding:13px;color:var(--text);font-size:12px;line-height:1.55}.version-box strong{color:var(--navy)}
    .modal{position:fixed;inset:0;z-index:40;background:rgba(10,15,20,.66);display:grid;place-items:center;padding:18px}.modal-card{width:min(520px,100%);max-height:min(720px,92dvh);overflow:auto;border-radius:21px;background:var(--surface);border:1px solid var(--line);box-shadow:0 25px 70px rgba(0,0,0,.35);padding:22px}.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:17px}.modal-head h2{font-size:19px;margin:0}.modal-head p{font-size:12px;color:var(--muted);line-height:1.5;margin:5px 0 0}.progress-track{height:9px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:15px 0 8px}.progress-bar{height:100%;width:0;background:var(--accent);transition:width .15s}.progress-label{font-size:12px;color:var(--muted)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:19px}
    .viewer{position:fixed;inset:0;z-index:60;background:#101419;color:#fff;display:flex;flex-direction:column;overflow:hidden}.viewer-bar{height:62px;padding:max(10px,env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:12px;background:rgba(16,20,25,.94);flex:none}.viewer-bar button{width:42px;height:42px;border:0;border-radius:12px;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center}.viewer-bar svg{width:20px}.viewer-info{min-width:0;flex:1}.viewer-info strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.viewer-info span{display:block;font-size:10px;color:#aeb7c0;margin-top:3px}.viewer-canvas{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;touch-action:none}.viewer-canvas img{display:block;width:100%;height:100%;object-fit:contain;object-position:center;background:transparent;transform-origin:center center;will-change:transform}.viewer-hint{position:absolute;top:74px;left:50%;transform:translateX(-50%);z-index:2;background:rgba(0,0,0,.68);color:#fff;border-radius:99px;padding:8px 13px;font-size:11px;white-space:nowrap;pointer-events:none;transition:opacity .25s}.viewer-hint.hide{opacity:0}.toast{position:fixed;z-index:100;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,20px);background:color-mix(in srgb,var(--text) 92%,transparent);color:var(--bg);border-radius:13px;padding:11px 15px;font-size:12px;opacity:0;pointer-events:none;transition:.22s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:960px){.folder-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.list-layout{grid-template-columns:minmax(300px,44%) 1fr}.topbar{padding:18px}.content{padding:20px}}
    @media(max-width:700px){.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:25;left:12px;right:12px;bottom:max(10px,env(safe-area-inset-bottom));height:68px;border:1px solid var(--line);border-radius:21px;padding:7px;display:block;box-shadow:0 10px 30px var(--shadow)}.brand,.storage-info{display:none}.nav{grid-template-columns:repeat(3,1fr);height:100%}.nav-btn{height:100%;padding:0;justify-content:center;flex-direction:column;gap:3px;font-size:10px}.nav-btn svg{width:18px}.main{padding-bottom:82px}.topbar{height:auto;padding:max(14px,env(safe-area-inset-top)) 14px 12px;grid-template-columns:1fr auto;gap:8px}.search-wrap{grid-template-columns:1fr 48px}.top-actions .icon-btn:first-child{display:none}.content{padding:16px}.page-head{align-items:flex-start}.folder-grid,.result-grid{grid-template-columns:1fr}.list-layout{height:auto;display:block}.list-panel{height:calc(100dvh - 218px)}.preview{display:none}.page-head h1{font-size:21px}.empty{padding:40px 18px}.settings-card{padding:17px}.inline-form{grid-template-columns:1fr}.settings-actions>*{flex:1}.viewer-bar{height:auto}.viewer-canvas{padding:0}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="brand-icon" data-icon="book-open"></div><div><div class="brand-kicker">MY SCORE</div><div class="brand-title" id="brandTitle">나의 악보집</div></div></div>
      <nav class="nav"><button class="nav-btn active" data-page="home"><span data-icon="library"></span><span>악보집</span></button><button class="nav-btn" data-page="recent"><span data-icon="clock"></span><span>최근 악보</span></button><button class="nav-btn" data-page="settings"><span data-icon="settings"></span><span>설정</span></button></nav>
      <div class="storage-info"><strong id="offlineStatus">오프라인 준비 중</strong><span id="storageSummary">저장된 악보를 확인하고 있습니다.</span></div>
    </aside>
    <section class="main">
      <header class="topbar"><form class="search-wrap" id="searchForm"><label class="search-box"><span data-icon="search"></span><input id="searchInput" type="search" autocomplete="off" enterkeyhint="search" placeholder="번호 또는 곡명으로 악보 검색"><button class="clear-search hidden" id="clearSearch" type="button" aria-label="검색어 지우기">×</button></label><button class="search-go" type="submit" aria-label="검색"><span data-icon="arrow-right"></span></button></form><div class="top-actions"><button class="icon-btn" id="quickTheme" type="button" aria-label="테마 변경"><span data-icon="moon"></span></button><button class="icon-btn" id="openSettings" type="button" aria-label="설정"><span data-icon="settings"></span></button></div></header>
      <main class="content" id="content"></main>
    </section>
  </div>
  <input id="folderInput" type="file" accept="image/*,.heic,.heif" webkitdirectory multiple hidden>
  <div class="modal hidden" id="importModal" role="dialog" aria-modal="true" aria-labelledby="importTitle"><div class="modal-card"><div class="modal-head"><div><h2 id="importTitle">악보집 가져오는 중</h2><p>이미지를 기기 안의 앱 저장공간에 복사하고 있습니다.<br>이 화면을 닫지 마세요.</p></div></div><div class="progress-track"><div class="progress-bar" id="importBar"></div></div><div class="progress-label" id="importLabel">준비 중…</div></div></div>
  <div class="viewer hidden" id="viewer"><div class="viewer-hint" id="viewerHint">세 번 누르면 목록으로 돌아갑니다</div><div class="viewer-bar"><button id="closeViewer" aria-label="닫기"><span data-icon="arrow-left"></span></button><div class="viewer-info"><strong id="viewerTitle"></strong><span id="viewerPath"></span></div><button id="resetZoom" aria-label="확대 초기화"><span data-icon="maximize"></span></button></div><div class="viewer-canvas" id="viewerCanvas"><img id="viewerImage" alt="선택한 악보"></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
