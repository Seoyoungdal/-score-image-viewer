<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">

  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="site.webmanifest">
  <title>악보 이미지 뷰어</title>
  <style>
    :root{--bg:#0f1115;--panel:#191c22;--line:#303640;--text:#f7f7f8;--muted:#9da3ad;--accent:#ff641f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.app{min-height:100svh;display:flex;flex-direction:column}.top{position:sticky;top:0;z-index:5;padding:max(18px,env(safe-area-inset-top)) 18px 15px;background:rgba(15,17,21,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.bar{display:flex;align-items:center;gap:12px}.logo{width:50px;height:50px;border-radius:15px;background:var(--accent);display:grid;place-items:center;font-size:29px}.title{flex:1}.title h1{font-size:22px;margin:0}.title small{color:var(--muted)}button{border:0;font:inherit;cursor:pointer}.iconBtn{width:48px;height:48px;border-radius:14px;background:var(--panel);color:var(--text);font-size:22px}.searchWrap{display:flex;gap:10px;margin-top:15px}.searchBox{flex:1;display:flex;align-items:center;background:#fff;border-radius:16px;padding:0 8px 0 16px}.searchBox input{min-width:0;flex:1;height:54px;border:0;outline:0;font-size:19px;background:transparent}.clear{width:40px;height:40px;border-radius:50%;background:#e8e9eb;color:#555;font-size:21px}.searchBtn{min-width:74px;border-radius:16px;background:var(--accent);color:#111;font-weight:800}.status{padding:12px 19px;color:var(--muted);font-size:14px}.grid{padding:0 16px 36px;display:grid;gap:12px}.item{display:flex;gap:14px;align-items:center;width:100%;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:18px;color:var(--text);text-align:left}.thumb{width:74px;height:92px;object-fit:cover;border-radius:9px;background:#fff}.meta{min-width:0}.name{font-size:17px;font-weight:750;word-break:break-all}.path{margin-top:7px;color:var(--muted);font-size:13px;word-break:break-all}.empty{margin:auto;padding:70px 26px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--text);font-size:22px;margin-bottom:10px}.viewer{position:fixed;inset:0;z-index:20;background:#000;display:none;overflow:auto;overscroll-behavior:contain;touch-action:pan-x pan-y pinch-zoom}.viewer.show{display:flex;align-items:flex-start;justify-content:center}.viewer img{display:block;max-width:100%;width:auto;height:auto;min-height:0;margin:auto;object-fit:contain}.viewerHint{position:fixed;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:8px 12px;border-radius:20px;background:#000a;color:#ddd;font-size:12px;pointer-events:none}.modal{position:fixed;inset:0;z-index:30;background:#000a;display:none;align-items:flex-end}.modal.show{display:flex}.sheet{width:100%;max-width:640px;margin:auto;background:var(--panel);border-radius:24px 24px 0 0;padding:24px 18px calc(24px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 20px}.field{display:grid;gap:7px;margin:14px 0}.field input{height:50px;border:1px solid var(--line);border-radius:13px;background:#101216;color:#fff;padding:0 14px;font-size:17px}.wide{width:100%;height:52px;border-radius:14px;background:var(--accent);font-weight:800;margin-top:9px}.secondary{background:#303640;color:#fff}.close{margin-top:16px;background:transparent;color:var(--muted)}input[type=file]{display:none}@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr);max-width:1100px;margin:auto}.sheet{border-radius:24px;margin:auto}.modal{align-items:center}}
    html,body{width:100%;max-width:100%;overflow-x:hidden}.app,.top{width:100%;max-width:100%}.bar,.title{min-width:0}.title h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.searchWrap{display:grid;grid-template-columns:minmax(0,1fr) 68px;width:100%;gap:8px}.searchBox{min-width:0;width:100%}.searchBox input{width:100%;font-size:16px}.searchBtn{width:68px;min-width:0;font-size:15px}.viewer{background:#fff}.viewer.show{align-items:center}.viewer img{width:auto;height:auto;max-width:100vw;max-height:100svh;object-fit:contain;background:#fff}.viewerHint{z-index:2;opacity:0;transition:opacity .35s ease;white-space:nowrap;max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis}.viewerHint.visible{opacity:1}.viewerError{display:none;margin:auto;padding:24px;color:#222;text-align:center;font-weight:700}.viewerError.show{display:block}@media(max-width:380px){.top{padding-left:10px;padding-right:10px}.logo{width:44px;height:44px}.iconBtn{width:42px;height:42px}.searchWrap{grid-template-columns:minmax(0,1fr) 60px}.searchBtn{width:60px;font-size:14px}.searchBox{padding-left:11px}.clear{width:35px;height:35px}}
    :root{color-scheme:light;--bg:#f5f7fa;--panel:#fff;--line:#ccd3dd;--text:#111827;--muted:#556274;--accent:#f4682a;--accentText:#17120f;--header:rgba(245,247,250,.94);--soft:#e5eaf1;--notice:#edf2f7;--shadow:0 14px 34px rgba(40,50,68,.1)}html[data-theme="dark"]{color-scheme:dark;--bg:#202630;--panel:#2b3440;--line:#465263;--text:#f8fafc;--muted:#c3cad4;--accent:#ff8a50;--accentText:#19110d;--header:rgba(32,38,48,.94);--soft:#3a4655;--notice:#232b35;--shadow:0 16px 38px rgba(0,0,0,.22)}body{background:radial-gradient(circle at 50% -20%,color-mix(in srgb,var(--accent) 10%,var(--bg)),var(--bg) 44%)}.app{height:100svh;min-height:0;overflow:hidden}.top{position:relative;flex:0 0 auto;background:var(--header)}.contentScroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}.searchBox{background:#fff}.searchBox input{color:#111827!important;-webkit-text-fill-color:#111827;caret-color:var(--accent);color-scheme:light}.searchBox input::placeholder{color:#6b7280;opacity:1}.item,.sheet,.folderCard{box-shadow:var(--shadow)}.sheet{max-height:92svh;overflow-y:auto}.wide:not(.secondary):not(.close),.searchBtn{color:var(--accentText)}.secondary{background:var(--soft);color:var(--text);border:1px solid var(--line)}.field input,.field select{width:100%;height:50px;border:1px solid var(--line);border-radius:13px;background:var(--panel);color:var(--text);padding:0 14px;font-size:17px}.themeNote,.fieldHelp{margin-top:7px;color:var(--muted);font-size:12px}.saveNeutral{background:var(--soft);color:var(--text);border:1px solid var(--line)}.nameRow{display:grid;grid-template-columns:minmax(0,1fr) 72px;gap:8px}.nameRow .saveNeutral{width:72px;height:50px;margin:0;border-radius:13px}.updateStatus{display:none;margin-top:12px;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--notice);color:var(--muted);font-size:14px;line-height:1.55}.updateStatus b{color:var(--text);font-size:16px}.folderSummary{grid-column:1/-1;width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.folderCard{min-width:0;padding:17px 14px;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text);text-align:left;transition:transform .15s ease,border-color .15s ease}.folderCard:active{transform:scale(.98);border-color:var(--accent)}.folderName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:14px;font-weight:650}.folderCount{margin-top:8px;color:var(--text);font-size:25px;font-weight:850}.folderCount span{margin-left:3px;color:var(--muted);font-size:13px;font-weight:650}.folderBack{margin-right:9px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--soft);color:var(--text);font-size:13px;font-weight:700}@media(min-width:760px){.folderSummary{grid-template-columns:repeat(4,minmax(0,1fr))}}
  </style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="bar"><div class="logo"><img src="icon.svg" alt="" style="width:50px;height:50px;border-radius:15px;display:block"></div><div class="title"><h1 id="appTitle">악보 이미지 뷰어</h1><small>번호 · 제목 검색</small></div><button class="iconBtn" id="settings" aria-label="설정">⚙</button></div>
    <div class="searchWrap"><div class="searchBox"><input id="q" autocomplete="off" placeholder="번호 또는 제목을 입력하세요"><button class="clear" id="clear" aria-label="검색어 지우기">×</button></div><button class="searchBtn" id="search">검색</button></div>
  </header>
  <div class="contentScroll" id="contentScroll">
    <div class="status" id="status">설정에서 악보 폴더를 선택해 주세요.</div>
    <main class="grid" id="results"><div class="empty"><b>악보 폴더를 선택해 주세요</b>설정 ⚙ → 악보집 폴더 선택</div></main>
  </div>
</div>
<div class="viewer" id="viewer"><div class="viewerHint" id="viewerHint">두 번 탭하면 검색 화면으로 돌아갑니다</div><div class="viewerError" id="viewerError">이미지를 표시하지 못했습니다.<br>파일 형식을 확인해 주세요.</div><img id="fullImage" alt="선택한 악보"></div>
<div class="modal" id="modal"><section class="sheet"><h2>설정</h2><label class="field">화면 테마<select id="themeSelect"><option value="system">시스템 설정에 맞춤</option><option value="light">밝게</option><option value="dark">어둡게</option></select><span class="themeNote">시스템 설정은 휴대폰이나 PC의 다크 모드를 자동으로 따릅니다.</span></label><label class="field">프로그램 이름<span class="fieldHelp">프로그램 이름을 사용자가 변경할 수 있습니다.</span><span class="nameRow"><input id="nameInput" maxlength="30"><button class="saveNeutral" id="saveName" type="button">저장</button></span></label><button class="wide secondary" id="choose">악보집 폴더 선택 / 새로고침</button><input type="file" id="folder" webkitdirectory directory multiple accept="image/*,.heic,.heif"><button class="wide secondary" id="checkUpdate">최신 버전 확인</button><div id="updateStatus" class="updateStatus"></div><button class="wide close" id="close">닫기</button><p style="color:var(--muted);font-size:13px;line-height:1.6">새 이미지를 넣은 뒤에는 같은 폴더를 다시 선택해 주세요.<br>현재 버전 1.2.10</p></section></div>
<script>
const $=s=>document.querySelector(s), q=$('#q'), results=$('#results'), status=$('#status'), folder=$('#folder');
const CURRENT_VERSION='1.2.10';
let files=[], urls=[], activeFolder=null; const imageExt=/\.(jpe?g|png|webp|gif|bmp|heic|heif)$/i;
const normalize=s=>String(s||'').normalize('NFC').toLocaleLowerCase('ko-KR').replace(/[\u200B-\u200D\uFEFF]/g,'').replace(/[^\p{L}\p{N}]+/gu,'');
function clearUrls(){urls.forEach(URL.revokeObjectURL);urls=[]}
function applyName(){const n=localStorage.getItem('scoreViewerName')||'악보 이미지 뷰어';$('#appTitle').textContent=n;document.title=n;$('#nameInput').value=n}
const themeMedia=matchMedia('(prefers-color-scheme: dark)');
function applyTheme(pref=localStorage.getItem('scoreViewerTheme')||'system'){const actual=pref==='system'?(themeMedia.matches?'dark':'light'):pref;document.documentElement.dataset.theme=actual;$('#themeSelect').value=pref}
function folderNameOf(f){const parts=(f.webkitRelativePath||f.name).split('/').filter(Boolean);return parts.length>2?parts.slice(1,-1).join(' / '):'최상위 폴더'}
function showFolderSummary(){activeFolder=null;clearUrls();results.innerHTML='';if(!files.length){status.textContent='설정에서 악보 폴더를 선택해 주세요.';results.innerHTML='<div class="empty"><b>악보 폴더를 선택해 주세요</b>설정 ⚙ → 악보집 폴더 선택</div>';return}const counts=new Map();files.forEach(f=>{const name=folderNameOf(f);counts.set(name,(counts.get(name)||0)+1)});status.textContent='폴더별 파일 현황';const wrap=document.createElement('div');wrap.className='folderSummary';[...counts.entries()].sort((a,b)=>a[0].localeCompare(b[0],'ko',{numeric:true,sensitivity:'base'})).forEach(([name,count])=>{const card=document.createElement('button');card.type='button';card.className='folderCard';card.innerHTML='<div class="folderName"></div><div class="folderCount"></div>';card.querySelector('.folderName').textContent=name;card.querySelector('.folderCount').innerHTML=`${count}<span>개</span>`;card.onclick=()=>showFolderFiles(name);wrap.appendChild(card)});results.appendChild(wrap);$('#contentScroll').scrollTop=0}
function showFolderFiles(name){activeFolder=name;clearUrls();q.value='';const selected=files.filter(f=>folderNameOf(f)===name).sort((a,b)=>a.name.localeCompare(b.name,'ko',{numeric:true,sensitivity:'base'}));status.innerHTML='<button class="folderBack" id="folderBack">‹ 폴더별 현황</button><span id="folderStatus"></span>';$('#folderStatus').textContent=`${name} · ${selected.length}개`;$('#folderBack').onclick=showFolderSummary;showFiles(selected,false);$('#contentScroll').scrollTop=0}
function showFiles(list,updateStatus=true){results.innerHTML='';if(updateStatus)status.textContent=`검색 결과 ${list.length}개`;if(!list.length){results.innerHTML='<div class="empty"><b>검색 결과가 없습니다</b>번호, 제목 일부 또는 폴더명을 입력해 보세요.</div>';return}list.forEach(f=>{const u=URL.createObjectURL(f);urls.push(u);const b=document.createElement('button');b.className='item';const path=f.webkitRelativePath||f.name;b.innerHTML=`<img class="thumb" src="${u}" alt=""><div class="meta"><div class="name"></div><div class="path"></div></div>`;b.querySelector('.name').textContent=f.name.replace(/\.[^.]+$/,'');b.querySelector('.path').textContent=path;b.onclick=()=>openImage(f);results.appendChild(b)})}
function search(){activeFolder=null;clearUrls();const raw=q.value.normalize('NFC').trim(), n=normalize(raw);if(!n){showFolderSummary();return}const tokens=raw.split(/[\s_\-–—.]+/u).map(normalize).filter(Boolean);const matched=files.filter(f=>{const path=(f.webkitRelativePath||f.name).normalize('NFC');const hay=normalize(path),base=normalize(f.name.replace(/\.[^.]+$/,''));return hay.includes(n)||base.includes(n)||tokens.every(t=>hay.includes(t))}).sort((a,b)=>a.name.localeCompare(b.name,'ko',{numeric:true,sensitivity:'base'}));showFiles(matched)}
let hintTimer;
function openImage(f){const hint=$('#viewerHint'),im=$('#fullImage'),error=$('#viewerError'),reader=new FileReader();error.classList.remove('show');im.style.display='block';im.removeAttribute('src');im.onload=()=>error.classList.remove('show');im.onerror=()=>{im.style.display='none';error.classList.add('show')};$('#viewer').classList.add('show');clearTimeout(hintTimer);hint.classList.add('visible');hintTimer=setTimeout(()=>hint.classList.remove('visible'),1800);reader.onload=()=>{im.src=reader.result};reader.onerror=()=>{im.style.display='none';error.classList.add('show')};reader.readAsDataURL(f)}
function closeViewer(){clearTimeout(hintTimer);$('#viewerHint').classList.remove('visible');$('#viewerError').classList.remove('show');const im=$('#fullImage');im.removeAttribute('src');im.style.display='block';$('#viewer').classList.remove('show');q.value='';if(activeFolder)showFolderFiles(activeFolder);else search()}
folder.onchange=()=>{clearUrls();files=[...folder.files].filter(f=>f.type.startsWith('image/')||imageExt.test(f.name));q.value='';search();$('#modal').classList.remove('show')};
$('#choose').onclick=()=>folder.click();$('#search').onclick=search;q.onkeydown=e=>{if(e.key==='Enter')search()};$('#clear').onclick=()=>{q.value='';q.focus();search()};
$('#settings').onclick=()=>{$('#modal').classList.add('show');applyName()};$('#close').onclick=()=>$('#modal').classList.remove('show');$('#modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('show')};
$('#saveName').onclick=()=>{localStorage.setItem('scoreViewerName',$('#nameInput').value.trim()||'악보 이미지 뷰어');applyName()};
$('#themeSelect').onchange=e=>{localStorage.setItem('scoreViewerTheme',e.target.value);applyTheme(e.target.value)};themeMedia.addEventListener?.('change',()=>{if((localStorage.getItem('scoreViewerTheme')||'system')==='system')applyTheme('system')});
$('#viewer').ondblclick=closeViewer;let lastTap=0;$('#viewer').addEventListener('touchend',e=>{const now=Date.now();if(now-lastTap<320){e.preventDefault();closeViewer()}lastTap=now},{passive:false});
const compareVersion=(a,b)=>{const aa=a.split('.').map(Number),bb=b.split('.').map(Number);for(let i=0;i<Math.max(aa.length,bb.length);i++){const d=(aa[i]||0)-(bb[i]||0);if(d)return d}return 0};
async function applyUpdate(){const box=$('#updateStatus');box.textContent='새 버전을 적용하고 있습니다…';try{if('serviceWorker' in navigator){const reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update()}if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('score-viewer-')).map(k=>caches.delete(k)))}const next=new URL(location.href);next.searchParams.set('updated',Date.now());location.replace(next.href)}catch(e){box.textContent='업데이트 적용에 실패했습니다. 인터넷 연결 후 다시 시도해 주세요.'}}
async function checkUpdate(){const box=$('#updateStatus'),btn=$('#checkUpdate');box.style.display='block';box.textContent='최신 버전을 확인하고 있습니다…';btn.disabled=true;try{if(location.protocol==='file:')throw new Error('local');const res=await fetch(`./version.json?t=${Date.now()}`,{cache:'no-store'});if(!res.ok)throw new Error('network');const info=await res.json();if(compareVersion(info.version,CURRENT_VERSION)>0){box.innerHTML='새 버전 <b>v'+info.version+'</b>이 있습니다.<br><button id="applyLatest" class="wide" style="margin-top:10px">업데이트 적용</button>';$('#applyLatest').onclick=applyUpdate}else{box.innerHTML='현재 버전 <b>v'+CURRENT_VERSION+'</b><br>현재 최신 버전입니다.'}}catch(e){box.innerHTML=location.protocol==='file:'?'PC에서 직접 연 파일은 자동 업데이트가 제한됩니다.<br>GitHub Pages에서 실행하면 업데이트를 바로 적용할 수 있습니다.':'버전 정보를 불러오지 못했습니다. 인터넷 연결 후 다시 시도해 주세요.'}finally{btn.disabled=false}}
$('#checkUpdate').onclick=checkUpdate;
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
window.addEventListener('pageshow',()=>{q.value=''});applyTheme();applyName();q.value='';
</script>
</body></html>
